[project]
name = "faust"
version = "0.1.0"
description = "Faust — Local CLI LLM with LangGraph agent orchestration"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "ollama>=0.3",
    "openai>=1.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=0.1.0",
    "langchain-core>=0.2",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
faust = "faust.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/faust"]
