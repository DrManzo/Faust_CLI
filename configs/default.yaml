# Faust — Default Configuration
# Edit values here or use: faust config set

backend: "ollama" # "ollama" | "openai_compat"
temperature: 0.7 # Float 0.0-2.0; lower = more deterministic
context_window: 8192 # Max tokens maintained in context history

# Multi-model routing
# Each role uses a dedicated local model pulled via Ollama.
models:
  default: "llama3.3:8b"      # General chat, memory, assistant
  coder: "qwen2.5-coder:14b"  # Code-focused tasks, test drafting
  planner: "deepseek-r1:8b"   # Reasoning, planning, decomposition

system_prompt: |
  You are Faust, a local AI assistant.
  You are direct, precise, and technically capable.

# Checkpointing / persistence
# "memory" keeps short-term thread state in process memory
# "sqlite" enables persistent LangGraph checkpointing in a local SQLite database.
checkpointer_backend: "memory"

sqlite:
  path: "data/faust.db"

# Long-term memory
# "memory" is in-process only
# "sqlite" persists durable user facts across separate Faust runs
memory:
  enabled: true
  backend: "sqlite"
  namespace: "memories"
  max_results: 3

ollama:
  base_url: "http://localhost:11434" # Default Ollama endpoint
  request_timeout: 120 # Seconds

# OpenAI-compatible backend (only used if backend = openai_compat)
openai_compat:
  base_url: "http://localhost:1234/v1"
  api_key: "local"
